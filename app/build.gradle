plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.pirateflix.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.pirateflix.tv'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
