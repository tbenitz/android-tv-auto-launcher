plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.pirateflix.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.pirateflix.tv'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '2.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Run a small media-control bridge in supporting cross-origin HTML5 iframes.
dependencies {
    implementation "androidx.webkit:webkit:1.15.0"
}
