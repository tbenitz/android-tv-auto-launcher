name: Android TV emulator navigation smoke test

on:
  pull_request:
    paths:
      - 'app/**'
      - 'ci/**'
      - '.github/workflows/tv-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android TV emulator and exercise native UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          script: bash ci/tv-smoke.sh
      - name: Archive captured TV screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-preview-smoke-screenshot
          path: |
            tv-preview.png
            tv-apps.png
            tv-app-actions.png
          if-no-files-found: ignore
