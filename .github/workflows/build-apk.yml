name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name APK for TV installation
        run: cp app/build/outputs/apk/debug/app-debug.apk PirateFlix-TV.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PirateFlix-TV-APK
          path: PirateFlix-TV.apk
          if-no-files-found: error

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PirateFlix-TV.apk
          generate_release_notes: true
          name: PirateFlix TV ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
