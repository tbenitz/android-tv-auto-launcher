name: Build PirateFlix TV APK

on:
  push:
    branches: [pirateflix-tv-wrapper]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager "platforms;android-35"
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare downloaded APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PirateFlix-TV.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PirateFlix-TV-APK
          path: PirateFlix-TV.apk
          if-no-files-found: error
