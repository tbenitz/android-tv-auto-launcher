name: Build and release Android TV APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Set up production signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo 'Production signing not configured; tagged release will use temporary debug signing.'
          fi

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEYSTORE_PATH != ''
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare public download and SHA256
        shell: bash
        run: |
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk TVAutoLaunch.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk TVAutoLaunch.apk
          fi
          sha256sum TVAutoLaunch.apk > TVAutoLaunch.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVAutoLaunch-APK
          path: |
            TVAutoLaunch.apk
            TVAutoLaunch.apk.sha256
          if-no-files-found: error

      # Bootstrap release: first successful push to main creates v1.0.0 and
      # makes the static site's /releases/latest/download/TVAutoLaunch.apk work.
      # Since no keystore secret is configured initially, this is debug signed.
      # Subsequent main pushes do NOT overwrite a public version silently.
      - name: Publish initial public download automatically (once)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'v1.0.0 already exists; keeping published binaries unchanged.'
          else
            gh release create v1.0.0 TVAutoLaunch.apk TVAutoLaunch.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'TV Auto Launch v1.0.0' \
              --notes 'First public build. This APK is debug-signed with a CI key; future builds may require uninstalling the old APK unless stable release signing secrets are configured. Settings are lost on uninstall. To verify this download, check TVAutoLaunch.apk.sha256.'
          fi

      - name: Publish tagged public release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TVAutoLaunch.apk
            TVAutoLaunch.apk.sha256
